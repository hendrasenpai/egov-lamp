memory_limit = 512M
post_max_size = 100M
upload_max_filesize = 100M

; ==========================================
; Optimasi Performa (Sangat berpengaruh di Windows)
; ==========================================
; Matikan Xdebug jika tidak sedang debugging baris-per-baris agar eksekusi PHP ngebut
xdebug.mode = off

; OPcache: Cache script yang sudah di-compile ke RAM
; Mengurangi beban I/O pembacaan file ribuan kali di Windows NTFS
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Xdebug Configuration (Hanya aktif jika xdebug.mode diubah ke debug)
#xdebug.mode=debug
#xdebug.start_with_request=yes
#xdebug.client_host=host.docker.internal
#xdebug.client_port=9003
#xdebug.idekey=VSCODE